<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Priyanshu Raj</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400&display=swap">
  <style>
    :root { --bg: #262220; --ink: #f3eee8; --muted: #8a8178; --line: #5a524d; --accent: #b4582f; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      align-content: end;
      gap: 32px;
      padding: 32px clamp(16px, 3.2vw, 44px);
      background: var(--bg);
      color: var(--ink);
      font-family: "Geist", "Helvetica Neue", Arial, sans-serif;
    }
    p { margin: 0; }
    .code { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    h1 {
      margin: 0;
      font: 400 clamp(6rem, 30vw, 28rem)/.84 "Instrument Serif", "Times New Roman", serif;
    }
    .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding-top: 18px; border-top: 1px solid var(--line); }
    a { color: inherit; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <p class="code">GET <span id="path">/this-page</span> → 404 Not Found</p>
  <h1>404</h1>
  <div class="row">
    <p>This page doesn’t exist, or it moved.</p>
    <a href="/">Back to the homepage →</a>
  </div>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
